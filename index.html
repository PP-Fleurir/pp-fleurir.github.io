<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleurir Session Resources</title>

<!-- Favicon.
     The SVG is inlined so the page still has an icon even if index.html is
     the only file uploaded. The .ico and apple-touch-icon are optional
     extras for older browsers and for "add to home screen"; browsers also
     find /favicon.ico on their own if it is sitting in the repo root. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16.00' cy='7.00' r='7.4' fill='%23E4649A'/><circle cx='24.56' cy='13.22' r='7.4' fill='%23E4649A'/><circle cx='21.29' cy='23.28' r='7.4' fill='%23E4649A'/><circle cx='10.71' cy='23.28' r='7.4' fill='%23E4649A'/><circle cx='7.44' cy='13.22' r='7.4' fill='%23E4649A'/><circle cx='16.0' cy='16.0' r='5.2' fill='%23F5B940'/></svg>" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f8f9fa;color:#2c3e50;font-size:14px;}

header{background:white;border-bottom:1px solid #e0e0e0;padding:20px 32px 16px;
       position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
header h1{font-size:1.4rem;font-weight:700;color:#1a1a2e;margin-bottom:3px;}
header p{font-size:0.82rem;color:#888;}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.rec-btn{display:inline-flex;flex-direction:column;align-items:flex-start;
         padding:7px 15px;border:1.5px solid #2c3e50;border-radius:8px;
         background:#2c3e50;color:white;text-decoration:none;font-size:0.85rem;
         font-weight:600;white-space:nowrap;transition:opacity 0.15s;}
.rec-btn:hover{opacity:0.85;}
.rec-btn span{font-size:0.7rem;font-weight:400;opacity:0.75;margin-top:1px;}

.controls{background:white;border-bottom:1px solid #e8e8e8;padding:14px 32px;
          display:flex;flex-direction:column;gap:12px;}
.row1{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
#search{flex:1;min-width:200px;padding:8px 14px;border:1.5px solid #ddd;
        border-radius:7px;font-size:0.9rem;outline:none;font-family:inherit;}
#search:focus{border-color:#5b8dee;}
.toggles{display:flex;gap:8px;flex-wrap:wrap;}
.toggle{padding:6px 14px;border:1.5px solid #ddd;border-radius:20px;background:white;
        font-size:0.8rem;cursor:pointer;white-space:nowrap;transition:all 0.15s;
        font-family:inherit;color:#2c3e50;}
.toggle:hover{border-color:#bbb;}
.toggle.active{background:#2c3e50;color:white;border-color:#2c3e50;}

.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.pills-label{font-size:0.75rem;font-weight:600;color:#aaa;text-transform:uppercase;
             letter-spacing:0.5px;margin-right:2px;}
.pill{padding:5px 12px;border-radius:20px;font-size:0.78rem;font-weight:600;
      cursor:pointer;transition:all 0.15s;user-select:none;white-space:nowrap;
      border:1.5px solid transparent;}
.pill:hover{opacity:0.8;}
.year-pill{padding:5px 12px;border-radius:20px;font-size:0.78rem;font-weight:600;
           cursor:pointer;transition:all 0.15s;user-select:none;white-space:nowrap;
           background:#f4f4f4;color:#555;border:1.5px solid #ddd;}
.year-pill:hover{background:#e8e8e8;}
.year-pill.active{background:#2c3e50;color:white;border-color:#2c3e50;}

.results-bar{padding:10px 32px;font-size:0.8rem;color:#999;
             border-bottom:1px solid #eee;background:white;}

table{width:100%;border-collapse:collapse;}
th{padding:10px 16px;text-align:left;font-size:0.78rem;font-weight:600;color:#888;
   text-transform:uppercase;letter-spacing:0.4px;border-bottom:2px solid #e8e8e8;
   white-space:nowrap;background:white;cursor:pointer;user-select:none;}
th:hover{color:#555;}
th .arr{opacity:0.25;margin-left:3px;font-size:0.7rem;}
th.sorted{color:#2c3e50;}
th.sorted .arr{opacity:1;}
td{padding:10px 16px;border-bottom:1px solid #f0f0f0;vertical-align:middle;line-height:1.4;}
tr:hover td{background:#fafbfc;}

.col-date{width:100px;color:#666;font-size:0.82rem;white-space:nowrap;}
.col-venue{width:90px;font-size:0.78rem;color:#888;white-space:nowrap;}
.col-facilitator{width:160px;color:#444;}
.col-host{width:120px;color:#6b747a;font-size:0.85rem;
          overflow:hidden;text-overflow:ellipsis;}
.col-resources{width:110px;text-align:center;}

.blurb{font-size:0.82rem;color:#7a8288;line-height:1.45;margin-top:3px;}
.blurb.open{white-space:pre-wrap;}
.blurb-toggle{background:none;border:none;padding:0 0 0 5px;font-family:inherit;
              font-size:0.78rem;color:#1A5276;font-weight:600;cursor:pointer;}
.blurb-toggle:hover{text-decoration:underline;}
.rec-hint{text-decoration:none;font-size:0.85rem;margin-left:2px;}
.rec-hint:hover{opacity:0.6;}
.res-link{text-decoration:none;font-size:0.8rem;font-weight:600;color:#1A5276;
          white-space:nowrap;}
a.res-link:hover{text-decoration:underline;}
.no-res{color:#ccc;font-size:0.78rem;}

.no-results,.loading{padding:60px;text-align:center;color:#bbb;background:white;}
.err{margin:24px 32px;background:#fdeceb;border:1px solid #f3c5c1;color:#8c2f26;
     padding:14px 16px;border-radius:8px;font-size:0.88rem;}
footer{padding:20px 32px;font-size:0.78rem;color:#bbb;text-align:right;}

@media(max-width:700px){
  .controls,.results-bar,footer{padding-left:16px;padding-right:16px;}
  header{padding:14px 16px;}
  th,td{padding:8px 6px;}
  /* th is nowrap by default, so a heading longer than its column drags the
     column wider and undoes the narrow layout. Let headings wrap and shrink
     a little here instead. */
  th{white-space:normal;font-size:0.68rem;letter-spacing:0.2px;}

  /* Session type and host go, facilitator stays. Four columns is already
     the most a phone will take, and the facilitator is the name people
     scan for. The host is still there on a wider screen, and still
     searchable from the box at the top. */
  .col-venue,.col-host{display:none;}

  /* Everything that is not the topic gets as narrow as it can, so the
     topic keeps the space it needs and wraps rather than being cut off. */
  /* "23 Jul 2026" wraps to two lines here rather than reserving a full
     line's width. Rows are usually two lines tall anyway once a blurb is
     showing, so this costs nothing and gives the topic 20px back. */
  .col-date{width:48px;font-size:0.76rem;white-space:normal;line-height:1.25;}
  .col-facilitator{width:88px;font-size:0.78rem;
                   overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .col-resources{width:56px;}
  .res-count-word{display:none;}
  .blurb{font-size:0.78rem;}
}
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div>
      <h1>🌸 Fleurir Session Resources</h1>
      <p>Cafe, Bistro &amp; Patisserie sessions — search by topic, facilitator or host</p>
    </div>
    <a class="rec-btn" id="rec-btn" href="#" target="_blank" rel="noopener">
      🎥 Recent recordings
      <span>kept for about a month</span>
    </a>
  </div>
</header>

<div class="controls">
  <div class="row1">
    <input type="text" id="search" placeholder="Search topic, facilitator or host…">
    <div class="toggles" id="venue-toggles"></div>
    <div class="toggles">
      <button class="toggle" id="btn-resources">📁 Any resources</button>
    </div>
  </div>
  <div class="pills" id="year-pills"></div>
</div>

<div class="results-bar" id="results-bar"></div>
<div id="err"></div>
<table id="table" style="display:none">
  <thead>
    <tr>
      <th class="col-date"      data-key="date">Date<span class="arr">↕</span></th>
      <th class="col-venue"     data-key="type">Session<span class="arr">↕</span></th>
      <th class="col-host"        data-key="host">Host<span class="arr">↕</span></th>
      <th class="col-facilitator" data-key="who">Facilitator<span class="arr">↕</span></th>
      <th class="col-topic"     data-key="topic">Topic<span class="arr">↕</span></th>
      <th class="col-resources" data-key="res">Resources<span class="arr">↕</span></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
<div id="no-results" class="no-results" style="display:none">No sessions match your filters.</div>
<div id="loading" class="loading">Loading sessions…</div>
<footer id="footer"></footer>

<script>
// ---------------------------------------------------------------------
// Paste the published CSV link here.
// In the spreadsheet: File > Share > Publish to web > the Sessions sheet
// > Comma-separated values (.csv), then copy the link it gives you.
// ---------------------------------------------------------------------
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_6BBCQkRZx9mYYJ0kcNA72FzNUKQoeaeU2UOafE7LGzXF2IC-f3kFtglYjyeMHY_JQq62DIZqygPe/pub?gid=1748292580&single=true&output=csv';

// Themes are not shown on this page, but the column is still read for one
// reason: rows carrying this theme are holiday markers rather than sessions,
// and they are filtered out. Remove this and 34 empty "sessions" appear.
const HIDE_THEME = 'No session (break)';

// Where the current recordings live, for the button in the header.
// Set to '' to remove that button.
//
// Individual sessions get their recording link from the "Recording" column
// in the sheet, which the daily script fills in and empties again as videos
// come and go. The page shows a link only where that column has one, so a
// session never claims to have a recording that has already been deleted.
const RECORDINGS_URL = 'https://drive.google.com/drive/folders/1OE1qdsYiM_VeVYKelzVWITkQK8jTRVG7';

// ---------------------------------------------------------------------

/* A real CSV parser rather than splitting on commas. Session topics are
   full of commas, quotes and the occasional line break, all of which
   break the naive version. */
function parseCSV(text){
  const rows=[]; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQuotes=false; }
      else field+=c;
    } else if(c==='"'){ inQuotes=true; }
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(c!=='\r'){ field+=c; }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}

/* Columns are found by heading, so reordering them in the sheet is fine. */
function toObjects(rows){
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const find=(...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const ix={ date:find('date'), type:find('type','café / bistro','cafe / bistro'),
             who:find('facilitator','presenter'), topic:find('topic'),
             theme:find('theme'), host:find('host'),
             blurb:find('blurb','description'),
             res:find('resources','resource folder'),
             files:find('files','file count'),
             rec:find('recording','recordings') };
  return rows.slice(1).map(r=>({
    date:  (r[ix.date]||'').trim(),
    type:  (r[ix.type]||'').trim(),
    who:   (r[ix.who]||'').trim(),
    topic: (r[ix.topic]||'').trim(),
    theme: (r[ix.theme]||'').trim(),
    host:  (r[ix.host]||'').trim(),
    blurb: (r[ix.blurb]||'').trim(),
    res:   (r[ix.res]||'').trim(),
    files: (r[ix.files]||'').trim(),
    rec:   (r[ix.rec]||'').trim()
  })).filter(s=>s.date);
}

let DATA=[];
let activeYears=new Set(), activeVenues=new Set();
let onlyResources=false;
let sort={key:'date',dir:-1};       // most recent session first
let expanded=new Set();             // which blurbs are open, by row key

const el=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yearOf=d=>(d||'').slice(0,4);

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* Anything that is not a real YYYY-MM-DD is shown exactly as typed rather than
   reformatted. A date entered oddly in the sheet should look wrong on the page -
   that is the signal to go and fix it - not quietly become something misleading. */
function niceDate(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');
  if(!m) return iso||'';
  const mon=MONTHS[+m[2]-1];
  if(!mon) return iso;
  return `${+m[3]} ${mon} ${m[1]}`;
}

/* The blurb sits under the topic. Long ones are collapsed to a single line
   with a toggle; short ones are just shown, since a "more" link that reveals
   four extra words is more annoying than useful. */
const BLURB_INLINE_LIMIT = 95;

function blurbBlock(s){
  const b=(s.blurb||'').replace(/\s+/g,' ').trim();
  if(!b) return '';
  const key=s.date+'|'+s.type;
  if(b.length<=BLURB_INLINE_LIMIT) return `<div class="blurb">${esc(b)}</div>`;
  const open=expanded.has(key);
  const shown=open ? b : b.slice(0,BLURB_INLINE_LIMIT).replace(/\s+\S*$/,'')+'…';
  return `<div class="blurb${open?' open':''}">${esc(shown)}`
       + `<button class="blurb-toggle" data-k="${esc(key)}" aria-expanded="${open}">`
       + `${open?'less':'more'}</button></div>`;
}

/* Only sessions that actually have a recording right now get a camera, and
   the link goes to the folder rather than the video file. The daily script
   empties this column when a video is deleted, so nothing here needs to
   know about retention periods. */
function recordingLink(s){
  if(!s.rec) return '';
  return ` <a class="rec-hint" href="${esc(s.rec)}" target="_blank" rel="noopener"`
       + ` title="A recording of this session is available for a limited time">🎥</a>`;
}

function render(){
  const q=el('search').value.toLowerCase().trim();
  let rows=DATA.filter(s=>{
    if(q && !s.topic.toLowerCase().includes(q) && !s.who.toLowerCase().includes(q)
         && !s.host.toLowerCase().includes(q)) return false;
    if(activeYears.size  && !activeYears.has(yearOf(s.date))) return false;
    if(activeVenues.size && !activeVenues.has(s.type)) return false;
    if(onlyResources && !s.res) return false;
    return true;
  });

  const k=sort.key, dir=sort.dir;
  rows.sort((a,b)=>{
    const av = k==='res' ? (a.res?1:0) : (a[k]||'').toLowerCase();
    const bv = k==='res' ? (b.res?1:0) : (b[k]||'').toLowerCase();
    if(av<bv) return -dir;
    if(av>bv) return dir;
    return a.date<b.date ? -1 : 1;
  });

  const withRes=rows.filter(s=>s.res).length;
  el('results-bar').textContent =
    (rows.length===DATA.length ? `${DATA.length} sessions` : `${rows.length} of ${DATA.length} sessions`)
    + ` · ${withRes} with resources`;

  document.querySelectorAll('th').forEach(th=>{
    const on = th.dataset.key===sort.key;
    th.classList.toggle('sorted', on);
    th.querySelector('.arr').textContent = on ? (dir===1?'↑':'↓') : '↕';
  });

  if(!rows.length){
    el('tbody').innerHTML=''; el('table').style.display='none';
    el('no-results').style.display=''; return;
  }
  el('no-results').style.display='none';
  el('table').style.display='';

  el('tbody').innerHTML=rows.map(s=>{
    const n=parseInt(s.files,10);
    // "files" is in its own span so the narrow layout can drop the word
    // and keep the number, rather than shrinking the whole label away.
    const label=Number.isFinite(n)&&n>0
      ? `📁 ${n}<span class="res-count-word"> file${n===1?'':'s'}</span>`
      : '📁<span class="res-count-word"> Open</span>';
    const resCell = s.res
      ? `<a class="res-link" href="${esc(s.res)}" target="_blank" rel="noopener" title="Open the folder in Drive">${label}</a>`
      : `<span class="no-res">—</span>`;
    return `<tr>
      <td class="col-date">${esc(niceDate(s.date))}${recordingLink(s)}</td>
      <td class="col-venue">${esc(s.type)}</td>
      <td class="col-host">${esc(s.host)}</td>
      <td class="col-facilitator">${esc(s.who)}</td>
      <td class="col-topic">${esc(s.topic)}${blurbBlock(s)}</td>
      <td class="col-resources">${resCell}</td>
    </tr>`;
  }).join('');

  el('tbody').querySelectorAll('.blurb-toggle').forEach(btn=>{
    btn.onclick=()=>{
      const k=btn.dataset.k;
      expanded.has(k)?expanded.delete(k):expanded.add(k);
      render();
    };
  });
}

function buildControls(){
  // venue toggles, built from whatever is actually in the sheet
  const icons={'Cafe':'☕','Café':'☕','Bistro':'🍽','Patisserie':'🥐','Pâtisserie':'🥐'};
  const venues=[...new Set(DATA.map(s=>s.type).filter(Boolean))].sort();
  const vt=el('venue-toggles');
  venues.forEach(v=>{
    const b=document.createElement('button');
    b.className='toggle';
    b.textContent=(icons[v]?icons[v]+' ':'')+v;
    b.onclick=()=>{
      activeVenues.has(v)?activeVenues.delete(v):activeVenues.add(v);
      b.classList.toggle('active',activeVenues.has(v));
      render();
    };
    vt.appendChild(b);
  });

  const years=[...new Set(DATA.map(s=>yearOf(s.date)).filter(Boolean))].sort();
  const yp=el('year-pills');
  const yl=document.createElement('span');
  yl.className='pills-label'; yl.textContent='Year:'; yp.appendChild(yl);
  years.forEach(y=>{
    const e=document.createElement('span');
    e.className='year-pill'; e.textContent=y;
    e.onclick=()=>{
      activeYears.has(y)?activeYears.delete(y):activeYears.add(y);
      e.classList.toggle('active',activeYears.has(y));
      render();
    };
    yp.appendChild(e);
  });

  const rb=el('rec-btn');
  if(RECORDINGS_URL) rb.href=RECORDINGS_URL;
  else rb.style.display='none';

  el('search').oninput=render;
  el('btn-resources').onclick=()=>{
    onlyResources=!onlyResources;
    el('btn-resources').classList.toggle('active',onlyResources);
    render();
  };
  document.querySelectorAll('th').forEach(th=>{
    th.onclick=()=>{
      const k=th.dataset.key;
      if(sort.key===k) sort.dir=-sort.dir;
      else sort={key:k,dir:1};
      render();
    };
  });
}

fetch(CSV_URL)
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
  .then(t=>{
    DATA=toObjects(parseCSV(t)).filter(s=>s.theme!==HIDE_THEME);
    el('loading').style.display='none';
    buildControls();
    el('footer').textContent='Last updated '+new Date().toLocaleDateString('en-GB',
      {day:'numeric',month:'long',year:'numeric'});
    render();
  })
  .catch(e=>{
    el('loading').style.display='none';
    el('err').innerHTML=`<div class="err"><strong>Could not load the sessions.</strong><br>
      Check the published CSV link near the top of this file is correct and that the
      sheet is still published.<br><small>${esc(e.message)}</small></div>`;
  });
</script>
</body>
</html>
